<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contatos</title>
<style>
:root{--txt:#f5f5f5;--mut:rgba(255,255,255,.55);--dim:rgba(255,255,255,.3);--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;padding:36px 16px 90px;
background:#000;background-image:radial-gradient(900px 600px at 10% -10%,rgba(255,255,255,.13),transparent 60%),radial-gradient(700px 500px at 110% 20%,rgba(255,255,255,.08),transparent 60%),radial-gradient(800px 600px at 50% 120%,rgba(255,255,255,.07),transparent 60%);background-attachment:fixed}
.wrap{max-width:900px;margin:0 auto}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
h1{font-size:30px;font-weight:700;letter-spacing:-.03em}
.sub{color:var(--mut);margin:4px 0 22px}
.head{padding:18px 20px;margin-bottom:14px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.prog{flex:1;min-width:200px}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .3s}
.ptxt{color:var(--mut);font-size:12px}
.top{position:sticky;top:0;z-index:10;padding:10px 0 14px}
.tools{display:flex;gap:8px;padding:8px}
input[type=search]{flex:1;min-width:0;background:transparent;border:0;color:var(--txt);font-size:15px;padding:10px 12px;outline:none}
input[type=search]::placeholder{color:var(--dim)}
.btn{flex-shrink:0;border:1px solid var(--line);background:var(--glass2);color:var(--txt);border-radius:11px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:.15s}
.btn:hover{background:rgba(255,255,255,.16)}
.group{margin-bottom:14px;overflow:hidden}
.gh{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line)}
.gh b{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.cnt{color:var(--mut);font-size:12px;margin-left:8px;font-variant-numeric:tabular-nums}
.gact{display:flex;gap:14px}
.gact a{color:var(--dim);font-size:12px;font-weight:600;cursor:pointer}
.gact a:hover{color:#fff}
.dh{display:flex;justify-content:space-between;align-items:center;padding:9px 18px;background:rgba(255,255,255,.035);border-bottom:1px solid rgba(255,255,255,.06)}
.dh b{font-size:12px;font-weight:700;letter-spacing:.04em}
.dh small{color:var(--mut);font-size:12px;margin-left:6px}
.dh .cnt{margin-left:8px}
.gh .ufs{display:block;color:var(--dim);font-size:11px;margin-top:2px;letter-spacing:.02em}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:11px 14px 11px 18px;border-bottom:1px solid rgba(255,255,255,.06);transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(255,255,255,.04)}
.ck{appearance:none;width:22px;height:22px;border:1.5px solid rgba(255,255,255,.35);border-radius:7px;cursor:pointer;display:grid;place-items:center;transition:.15s;background:rgba(255,255,255,.03)}
.ck:hover{border-color:#fff}
.ck:checked{background:#fff;border-color:#fff}
.ck:checked::after{content:"";width:6px;height:11px;border:solid #000;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.info{min-width:0}
.num{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
.meta{color:var(--mut);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .nm{color:rgba(255,255,255,.8);font-weight:600}
.row.on .num{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.row.on .meta{opacity:.5}
.cp{width:36px;padding:9px 0;color:var(--mut)}
.wa{background:#fff;border-color:#fff;color:#000}
.wa:hover{background:#e6e6e6}
.wa svg{width:15px;height:15px}
.empty{color:var(--mut);text-align:center;padding:50px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:#fff;color:#000;padding:10px 18px;border-radius:999px;font-weight:700;transition:.25s;z-index:50}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (max-width:640px){
  body{padding:24px 10px 80px}
  .row{gap:9px;padding:10px 10px 10px 12px}
  .wa span{display:none}
  .wa{padding:9px 11px}
  .gh{padding:12px 14px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Contatos</h1>
  <p class="sub">Separados por região e DDD. Marque quem já foi contatado.</p>
  <div class="glass head">
    <div class="kpi"><b id="kTotal">0</b><span>Contatos</span></div>
    <div class="kpi"><b id="kMarked">0</b><span>Marcados</span></div>
    <div class="prog"><div class="bar"><i id="bar"></i></div><div class="ptxt" id="ptxt"></div></div>
  </div>
  <div class="top">
    <div class="glass tools">
      <input id="q" type="search" placeholder="Buscar nome ou número…" autocomplete="off">
      <button class="btn" id="copyVis" title="Copiar os números visíveis">⧉ Copiar</button>
    </div>
  </div>
  <div id="out"></div>
</div>
<div class="toast" id="toast"></div>

const REG = {SP:"Sudeste",RJ:"Sudeste",ES:"Sudeste",MG:"Sudeste",PR:"Sul",SC:"Sul",RS:"Sul",
  DF:"Centro-Oeste",GO:"Centro-Oeste",MT:"Centro-Oeste",MS:"Centro-Oeste",
  BA:"Nordeste",SE:"Nordeste",AL:"Nordeste",PE:"Nordeste",PB:"Nordeste",RN:"Nordeste",CE:"Nordeste",PI:"Nordeste",MA:"Nordeste",
  PA:"Norte",AM:"Norte",AC:"Norte",RO:"Norte",RR:"Norte",AP:"Norte",TO:"Norte"};
const REG_ORDER = ["Sudeste","Sul","Centro-Oeste","Nordeste","Norte","Outros","Internacional"];
const regOf = c => c.uf === "INT" ? "Internacional" : (REG[c.uf] || "Outros");
const dddOf = c => c.uf === "INT" ? "INT:" + c.p : c.ddd;
const cntTxt = g => `${g.filter(c => marked.has(c.d)).length}/${g.length}`;

function render() {
  const list = filtered();
  if (!list.length) { $("out").innerHTML = `<div class="glass empty">Nada encontrado.</div>`; return; }
  const regs = new Map();
  list.forEach(c => {
    const r = regOf(c), k = dddOf(c);
    if (!regs.has(r)) regs.set(r, new Map());
    const m = regs.get(r);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(c);
  });
  $("out").innerHTML = REG_ORDER.filter(r => regs.has(r)).map(r => {
    const m = regs.get(r);
    const all = [...m.values()].flat();
    const ufs = [...new Set(all.map(c => c.uf === "INT" ? c.p : c.uf))].join(" · ");
    const keys = [...m.keys()].sort((a, b) => a.localeCompare(b, "pt", {numeric: true}));
    return `<section class="glass group"><div class="gh"><div><b>${esc(r)}</b><span class="cnt" data-cnt="R:${esc(r)}">${cntTxt(all)}</span><span class="ufs">${esc(ufs)}</span></div>
      <div class="gact"><a data-mark="R:${esc(r)}">marcar todos</a><a data-unmark="R:${esc(r)}">desmarcar</a></div></div>
      ${keys.map(k => {
        const g = m.get(k), c0 = g[0];
        const title = c0.uf === "INT" ? esc(c0.p) : `DDD ${k}<small>${esc(D.uf_nome[c0.uf] || c0.uf)}</small>`;
        return `<div class="dh"><div><b>${title}</b><span class="cnt" data-cnt="D:${esc(k)}">${cntTxt(g)}</span></div>
          <div class="gact"><a data-mark="D:${esc(k)}">marcar</a><a data-unmark="D:${esc(k)}">desmarcar</a></div></div>${g.map(rowHTML).join("")}`;
      }).join("")}</section>`;
  }).join("");
}

function scope(key) {
  const [t, v] = [key.slice(0, 1), key.slice(2)];
  return filtered().filter(c => t === "R" ? regOf(c) === v : dddOf(c) === v);
}

function refreshCounts(c) {
  for (const key of ["R:" + regOf(c), "D:" + dddOf(c)]) {
    const el = document.querySelector(`[data-cnt="${CSS.escape(key)}"]`);
    if (el) el.textContent = cntTxt(scope(key));
  }
}

function setMark(d, on) {
  on ? marked.add(d) : marked.delete(d);
  const row = document.querySelector(`.row[data-d="${d}"]`);
  if (row) { row.classList.toggle("on", on); row.querySelector(".ck").checked = on; }
  persist(); progress();
  const c = D.c.find(x => x.d === d);
  if (c) refreshCounts(c);
}

function bulk(key, on) {
  const g = scope(key);
  g.forEach(c => on ? marked.add(c.d) : marked.delete(c.d));
  persist(); progress(); render();
  toast(`${g.length} ${on ? "marcados" : "desmarcados"}`);
}

$("out").addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.mark) { bulk(t.dataset.mark, true); return; }
  if (t.dataset.unmark) { bulk(t.dataset.unmark, false); return; }
  const cp = t.closest("[data-copy]");
  if (cp) { copy(cp.dataset.copy); return; }
  const row = t.closest(".row");
  if (!row) return;
  const d = row.dataset.d;
  if (t.classList.contains("ck")) setMark(d, t.checked);
  else if (t.closest(".num")) setMark(d, !marked.has(d));
  else if (t.closest(".wa")) setMark(d, true);
});

let qt;
$("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { query = e.target.value; render(); }, 120); });
$("copyVis").addEventListener("click", () => { const l = filtered(); copy(l.map(c => c.n).join("\n"), `${l.length} números copiados`); });

progress(); render();
</script>
</body>
</html>
