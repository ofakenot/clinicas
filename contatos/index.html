<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contatos · WhatsApp</title>
<style>
:root{--bg:#0b0d0c;--card:#141816;--line:#232a26;--txt:#e9efeb;--mut:#8a958f;--wa:#25d366;--wa2:#1ebe5a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;padding:24px 16px 60px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:6px 0 20px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-size:20px}.stat span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:10px;flex-wrap:wrap}
input,select{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 14px;font-size:15px;outline:none}
input{flex:1;min-width:200px}input:focus,select:focus{border-color:var(--wa)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 18px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--wa);border-color:var(--wa);color:#04140a;font-weight:600}
.group h2{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 10px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:8px}
.row.done{opacity:.45}
.num{flex:1;min-width:0;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500}
.nm{display:block;color:var(--mut);font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.num small{display:block;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:11px;font-weight:400}
.btn{flex-shrink:0;border:0;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;padding:8px 10px;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.wa{background:var(--wa);color:#04140a}.wa:hover{background:var(--wa2)}
.cp{background:transparent;border:1px solid var(--line);color:var(--mut)}.cp:hover{color:var(--txt)}
.names{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;color:var(--mut)}
.names b{color:var(--txt)}
.warn{border-left:3px solid #e0b341;background:#1a1710;border-radius:8px;padding:10px 14px;color:#d9c48c;margin-bottom:18px;font-size:14px}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.t-both{background:#3a2a10;color:#f0b84a}.t-l2{background:#0f2e1c;color:#4ee38a}.t-l1{background:#1c2230;color:#8fb0ff}
.row.dup{border-color:#4a3714}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{color:var(--mut);text-align:center;padding:40px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--wa);color:#04140a;padding:10px 18px;border-radius:999px;font-weight:600;transition:.25s}
.toast.show{transform:translateX(-50%) translateY(0)}
svg{width:15px;height:15px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Contatos</h1>
  <p class="sub">Lista 1 (grupo do WhatsApp) + lista 2 (CSV), sem repetição. Organizados por estado (DDD). Clique em WhatsApp pra abrir a conversa direto.</p>
  <div class="stats" id="stats"></div>
  <div id="warn"></div>
  <div id="names"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar nome, número ou DDD…" autocomplete="off">
    <select id="sort">
      <option value="uf">Agrupar por estado</option>
      <option value="ddd">Agrupar por DDD</option>
      <option value="none">Lista única</option>
    </select>
    <button class="btn cp" id="copyAll">Copiar visíveis</button>
    <button class="btn cp" id="reset">Limpar marcados</button>
  </div>
  <div class="seg" id="seg"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>

const WA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>';
let state = {q:"", uf:"ALL", sort:"uf", st:"ALL"};
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem("wa_done")||"[]")); } catch(e) {}
const save = () => { try { localStorage.setItem("wa_done", JSON.stringify([...done])); } catch(e) {} };
const $ = id => document.getElementById(id);

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),1600); }
async function copy(t){
  try { await navigator.clipboard.writeText(t); }
  catch(e){ const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast("Copiado");
}

function stats(){
  const s=$("stats");
  const n=Object.keys(D.ufs).length;
  s.innerHTML = `<div class="stat"><b>${D.contatos.length}</b><span>Números</span></div>
    <div class="stat"><b>${n}</b><span>Estados + exterior</span></div>
    <div class="stat"><b>${cnt("both")}</b><span>Duplicados (nas 2 listas)</span></div>
    <div class="stat"><b>${cnt("l2")}</b><span>Novos (só no CSV)</span></div>
    <div class="stat"><b>${cnt("l1")}</b><span>Só lista 1</span></div>
    <div class="stat"><b id="sDone">${done.size}</b><span>Contatados</span></div>`;
  if (D.restantes) $("warn").innerHTML = `<div class="warn">O arquivo veio cortado: o WhatsApp mostrou só esses e escondeu mais <b>${D.restantes}</b> contatos ("mais ${D.restantes}"). Pra pegar todos, abra a lista completa de participantes do grupo e copie de novo.</div>`;
  if (D.nomes.length) $("names").innerHTML = `<div class="names">Salvos na agenda (sem número no arquivo): <b>${D.nomes.map(esc).join("</b>, <b>")}</b></div>`;
}
function cnt(s){ return D.contatos.filter(c=>c.s===s).length; }
function esc(t){ return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function chips(){
  const order = Object.entries(D.ufs).sort((a,b)=>b[1]-a[1]);
  $("chips").innerHTML = `<button class="chip ${state.uf==="ALL"?"on":""}" data-uf="ALL">Todos · ${D.contatos.length}</button>` +
    order.map(([uf,n])=>`<button class="chip ${state.uf===uf?"on":""}" data-uf="${uf}">${uf} · ${n}</button>`).join("");
  const segs=[["ALL","Todos"],["both","Duplicados · "+cnt("both")],["l2","Novos · "+cnt("l2")],["l1","Só lista 1 · "+cnt("l1")]];
  $("seg").innerHTML = segs.map(([k,t])=>`<button class="chip ${state.st===k?"on":""}" data-st="${k}">${t}</button>`).join("");
}

function filtered(){
  const raw = state.q.trim().toLowerCase(), q = raw.replace(/\D/g,"");
  return D.contatos.filter(c => (state.uf==="ALL"||c.uf===state.uf) && (state.st==="ALL"||c.s===state.st) &&
    (!raw || (q && c.d.includes(q)) || (c.nm||"").toLowerCase().includes(raw)));
}

function card(c){
  const T={both:"Duplicado",l2:"Novo",l1:"Lista 1"};
  return `<div class="row ${done.has(c.d)?"done":""} ${c.s==="both"?"dup":""}" data-d="${c.d}">
    <div class="num">${esc(c.n)}${c.nm?`<span class="nm">${esc(c.nm)}</span>`:""}<small>${c.uf==="INT"?esc(c.p||"Exterior"):`${D.uf_nome[c.uf]||c.uf} · DDD ${c.ddd}`}<span class="tag t-${c.s}">${T[c.s]}</span></small></div>
    <button class="btn cp" data-copy="${esc(c.n)}" title="Copiar">⧉</button>
    <a class="btn wa" href="https://wa.me/${c.d}" target="_blank" rel="noopener" data-open="${c.d}">${WA}WhatsApp</a>
  </div>`;
}

function render(){
  const list = filtered();
  if (!list.length){ $("list").innerHTML = `<div class="empty">Nada encontrado.</div>`; return; }
  if (state.sort==="none"){ $("list").innerHTML = `<div class="grid">${list.map(card).join("")}</div>`; return; }
  const key = state.sort==="uf" ? (c=>c.uf) : (c=>c.ddd);
  const groups = {};
  list.forEach(c => (groups[key(c)] ||= []).push(c));
  const keys = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length || a.localeCompare(b));
  $("list").innerHTML = keys.map(k => {
    const label = k==="INT"||(state.sort==="ddd"&&k==="") ? "Internacional" : state.sort==="uf" ? `${D.uf_nome[k]||k} (${k})` : `DDD ${k} · ${D.uf_nome[groups[k][0].uf]||""}`;
    return `<section class="group"><h2><span>${label}</span><span>${groups[k].length}</span></h2><div class="grid">${groups[k].map(card).join("")}</div></section>`;
  }).join("");
}

$("q").addEventListener("input", e => { state.q=e.target.value; render(); });
$("sort").addEventListener("change", e => { state.sort=e.target.value; render(); });
$("seg").addEventListener("click", e => { const b=e.target.closest(".chip"); if(!b) return; state.st=b.dataset.st; chips(); render(); });
$("chips").addEventListener("click", e => { const b=e.target.closest(".chip"); if(!b) return; state.uf=b.dataset.uf; chips(); render(); });
$("list").addEventListener("click", e => {
  const cp=e.target.closest("[data-copy]"); if(cp){ copy(cp.dataset.copy); return; }
  const op=e.target.closest("[data-open]");
  if(op){ done.add(op.dataset.open); save(); op.closest(".row").classList.add("done"); $("sDone").textContent=done.size; }
});
$("copyAll").addEventListener("click", () => copy(filtered().map(c=>c.n).join("\n")));
$("reset").addEventListener("click", () => { done.clear(); save(); $("sDone").textContent=0; render(); toast("Marcações limpas"); });

stats(); chips(); render();
</script>
