<style>
/* Layout: lista de prospecção — cabeçalho com contadores, abas, filtros, busca, linhas densas com botão de WhatsApp à direita */
:root{

  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#161E1B; --ink:#E6ECE9; --muted:#8E9A94; --line:#25302C;
  --accent:#2FBF85; --accent-ink:#06130D; --accent-soft:#16302A; --done:#56625C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#161E1B; --ink:#E6ECE9; --muted:#8E9A94; --line:#25302C;
  --accent:#2FBF85; --accent-ink:#06130D; --accent-soft:#16302A; --done:#56625C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-weight:600}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.main-tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.mtab{flex:1;border:0;background:transparent;color:var(--muted);font:600 15px var(--f-body);padding:11px 16px;border-radius:10px;cursor:pointer}
.mtab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.mtab small{font-family:var(--f-mono);font-weight:500;margin-left:6px;opacity:.75}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab small{font-family:var(--f-mono);font-weight:500;margin-left:6px;opacity:.75}
#q{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:15px var(--f-body)}
.hide-done{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.mtab:focus-visible,.tab:focus-visible,#q:focus-visible,.wa:focus-visible,.copy:focus-visible,.chk:focus-visible,.gmark:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ol{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li.reg{display:flex;justify-content:space-between;align-items:baseline;background:var(--ink);color:var(--bg);padding:12px 14px}
li.reg b{font-family:var(--f-display);font-size:18px;font-weight:600}
li.reg span{font:500 12px var(--f-mono);opacity:.75}
li.ddd{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);padding:8px 14px}
li.ddd b{font:500 13px var(--f-mono);color:var(--accent)}
li.ddd span{font-size:13px;color:var(--muted)}
.gmark{border:0;background:transparent;color:var(--accent);font:600 12px var(--f-body);cursor:pointer;padding:2px 0;white-space:nowrap}
.idx{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.name{font-weight:600;margin:0;overflow-wrap:anywhere}
.addr{color:var(--muted);font-size:13px;margin:2px 0 0;overflow-wrap:anywhere}
.act{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.wa{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font:500 14px var(--f-mono);padding:8px 12px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.wa:hover{filter:brightness(1.08)}
.wa svg{width:15px;height:15px;fill:currentColor}
.copy{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:7px 9px;font:12px var(--f-body);cursor:pointer}
.chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
li.done .name,li.done .addr{color:var(--done);text-decoration:line-through}
li.done .wa{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
@media (max-width:560px){
  li{grid-template-columns:minmax(0,1fr);gap:8px}
  .idx{display:none}
  .act{justify-content:flex-start}
  .stats{gap:14px}
  .mtab{padding:10px 8px;font-size:14px}
  .tabs{border-radius:14px}
}
</style>

uai","+598 99 975 795",""],["61402004337","","INT","Austrália","+61 402 004 337",""],["6281229203577","","INT","Indonésia","+62 812-2920-3577",""],["6281412069330","","INT","Indonésia","+62 814-1206-9330",""],["6283121039388","","INT","Indonésia","+62 831-2103-9388",""],["6285122429358","","INT","Indonésia","+62 851-2242-9358",""],["6285129273756","","INT","Indonésia","+62 851-2927-3756",""],["6285166892375","","INT","Indonésia","+62 851-6689-2375",""],["6285668939907","","INT","Indonésia","+62 856-6893-9907",""],["6285700860698","","INT","Indonésia","+62 857-0086-0698",""],["6285796166916","","INT","Indonésia","+62 857-9616-6916",""],["6285812250644","","INT","Indonésia","+62 858-1225-0644",""],["6287719704491","","INT","Indonésia","+62 877-1970-4491",""],["6287740024480","","INT","Indonésia","+62 877-4002-4480",""],["639100846640","","INT","Filipinas","+63 910 084 6640",""],["639300794774","","INT","Filipinas","+63 930 079 4774",""],["639383864704","","INT","Filipinas","+63 938 386 4704",""],["639489041153","","INT","Filipinas","+63 948 904 1153",""],["819084701979","","INT","Japão","+81 90-8470-1979",""]]).map(([d,ddd,uf,p,n,nm])=>({d,ddd,uf,p,n,nm}));

const KEY='clinicas-contatadas';
const KEY_C='contatos-diversos-marcados';
const KEY_OLD='wa_marcados_v3';
const KEY_VIEW='clinicas-aba';
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let doneC={};try{doneC=JSON.parse(localStorage.getItem(KEY_C)||'{}')}catch(e){}
try{if(!localStorage.getItem('contatos-migrado')){(JSON.parse(localStorage.getItem(KEY_OLD)||'[]')||[]).forEach(d=>{doneC[d]=1});localStorage.setItem('contatos-migrado','1')}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done));localStorage.setItem(KEY_C,JSON.stringify(doneC))}catch(e){}};
save();

const UF={SP:"São Paulo",RJ:"Rio de Janeiro",ES:"Espírito Santo",MG:"Minas Gerais",PR:"Paraná",SC:"Santa Catarina",RS:"Rio Grande do Sul",
  DF:"Distrito Federal",GO:"Goiás",MT:"Mato Grosso",MS:"Mato Grosso do Sul",BA:"Bahia",SE:"Sergipe",AL:"Alagoas",PE:"Pernambuco",
  PB:"Paraíba",RN:"Rio Grande do Norte",CE:"Ceará",PI:"Piauí",MA:"Maranhão",PA:"Pará",AM:"Amazonas",AC:"Acre",RO:"Rondônia",
  RR:"Roraima",AP:"Amapá",TO:"Tocantins","??":"DDD desconhecido"};
const REG={SP:"Sudeste",RJ:"Sudeste",ES:"Sudeste",MG:"Sudeste",PR:"Sul",SC:"Sul",RS:"Sul",DF:"Centro-Oeste",GO:"Centro-Oeste",
  MT:"Centro-Oeste",MS:"Centro-Oeste",BA:"Nordeste",SE:"Nordeste",AL:"Nordeste",PE:"Nordeste",PB:"Nordeste",RN:"Nordeste",
  CE:"Nordeste",PI:"Nordeste",MA:"Nordeste",PA:"Norte",AM:"Norte",AC:"Norte",RO:"Norte",RR:"Norte",AP:"Norte",TO:"Norte"};
const REG_ORDER=["Sudeste","Sul","Centro-Oeste","Nordeste","Norte","Outros","Internacional"];
const regOf=c=>c.uf==="INT"?"Internacional":(REG[c.uf]||"Outros");
const grpOf=c=>c.uf==="INT"?"INT:"+c.p:c.ddd;
const REG_COUNT={};CONT.forEach(c=>{const r=regOf(c);REG_COUNT[r]=(REG_COUNT[r]||0)+1});
const REGIONS=REG_ORDER.filter(r=>REG_COUNT[r]);

let view='clin', city='cwb', region='Todas';
try{const v=localStorage.getItem(KEY_VIEW);if(v==='clin'||v==='cont')view=v}catch(e){}

const fmt=t=>`(${t.slice(0,2)}) ${t.slice(2,7)}-${t.slice(7)}`;
const fmtC=c=>{if(c.uf==="INT")return c.n;const r=c.d.slice(4);return `(${c.ddd}) ${r.slice(0,-4)}-${r.slice(-4)}`};
const ico='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2s.2-1.1.1-1.2l-.4-.2Z"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

function subTabs(){
  const box=$('sub');
  if(view==='clin'){
    box.innerHTML=`<button class="tab" role="tab" data-c="cwb" aria-selected="${city==='cwb'}">Curitiba<small>${DATA.cwb.length}</small></button>`+
      `<button class="tab" role="tab" data-c="sp" aria-selected="${city==='sp'}">São Paulo<small>${DATA.sp.length}</small></button>`;
  }else{
    box.innerHTML=[['Todas',CONT.length],...REGIONS.map(r=>[r,REG_COUNT[r]])]
      .map(([r,n])=>`<button class="tab" role="tab" data-r="${esc(r)}" aria-selected="${region===r}">${esc(r)}<small>${n}</small></button>`).join('');
  }
}

function header(){
  document.querySelectorAll('.mtab').forEach(x=>x.setAttribute('aria-selected',x.dataset.v===view));
  const all=[...DATA.cwb,...DATA.sp];
  $('mClin').textContent=all.length;
  $('mCont').textContent=CONT.length;
  if(view==='clin'){
    $('title').innerHTML='Clínicas de estética<br>Curitiba e São Paulo';
    $('subtitle').textContent='Só clínicas com celular. Toque no número para abrir o WhatsApp.';
    $('sTotal').textContent=all.length;
    $('sDone').textContent=all.filter(r=>done[r.t]).length;
    $('sDoneLbl').textContent='contatadas';
    $('hideLbl').textContent='Ocultar contatadas';
    $('q').placeholder='Buscar por nome ou bairro';
    $('note').textContent='Marque a caixinha ao lado de cada clínica depois de chamar. A marcação fica salva só neste navegador. Fonte: Google Maps, outubro de 2026.';
  }else{
    $('title').innerHTML='Contatos diversos<br>por região';
    $('subtitle').textContent='Separados por região e DDD, sem repetidos e sem os números que já estão nas clínicas.';
    $('sTotal').textContent=CONT.length;
    $('sDone').textContent=CONT.filter(c=>doneC[c.d]).length;
    $('sDoneLbl').textContent='contatados';
    $('hideLbl').textContent='Ocultar contatados';
    $('q').placeholder='Buscar por nome, número ou DDD';
    $('note').textContent='Marque a caixinha depois de chamar. A marcação fica salva só neste navegador. Fonte: listas de grupos do WhatsApp e planilha, outubro de 2026.';
  }
}

function renderClin(){
  const q=$('q').value.trim().toLowerCase();
  const hide=$('hideDone').checked;
  const rows=DATA[city].map((r,i)=>({...r,i})).filter(r=>(!q||(r.n+' '+r.a).toLowerCase().includes(q))&&!(hide&&done[r.t]));
  $('list').innerHTML=rows.length?rows.map(r=>`<li class="${done[r.t]?'done':''}">
    <span class="idx">${String(r.i+1).padStart(3,'0')}</span>
    <div style="min-width:0"><p class="name">${esc(r.n)}</p><p class="addr">${esc(r.a)}</p></div>
    <div class="act">
      <a class="wa" href="https://wa.me/55${r.t}" target="_blank" rel="noopener">${ico}${fmt(r.t)}</a>
      <button class="copy" data-copy="+55${r.t}" type="button">Copiar</button>
      <input class="chk" type="checkbox" data-t="${r.t}" ${done[r.t]?'checked':''} aria-label="Marcar como contatada">
    </div></li>`).join(''):'<li class="empty" style="display:block">Nenhuma clínica encontrada para essa busca.</li>';
}

function contFiltered(){
  const raw=$('q').value.trim().toLowerCase();
  const hide=$('hideDone').checked;
  const digits=/[a-zà-ú]/i.test(raw)?'':raw.replace(/\D/g,'');
  return CONT.filter(c=>{
    if(region!=='Todas'&&regOf(c)!==region)return false;
    if(hide&&doneC[c.d])return false;
    if(!raw)return true;
    return (digits&&c.d.includes(digits))||(c.nm||'').toLowerCase().includes(raw)||(c.p||'').toLowerCase().includes(raw)||(UF[c.uf]||'').toLowerCase().includes(raw);
  });
}

function rowC(c,i){
  const where=c.uf==="INT"?esc(c.p):`DDD ${c.ddd} · ${esc(UF[c.uf]||c.uf)}`;
  return `<li class="${doneC[c.d]?'done':''}">
    <span class="idx">${String(i).padStart(4,'0')}</span>
    <div style="min-width:0"><p class="name">${c.nm?esc(c.nm):esc(fmtC(c))}</p><p class="addr">${where}</p></div>
    <div class="act">
      <a class="wa" href="https://wa.me/${c.d}" target="_blank" rel="noopener">${ico}${esc(fmtC(c))}</a>
      <button class="copy" data-copy="+${c.d}" type="button">Copiar</button>
      <input class="chk" type="checkbox" data-d="${c.d}" ${doneC[c.d]?'checked':''} aria-label="Marcar como contatado">
    </div></li>`;
}

function renderCont(){
  const list=contFiltered();
  if(!list.length){$('list').innerHTML='<li class="empty" style="display:block">Nenhum contato encontrado.</li>';return}
  const regs=new Map();
  list.forEach(c=>{const r=regOf(c),g=grpOf(c);if(!regs.has(r))regs.set(r,new Map());const m=regs.get(r);if(!m.has(g))m.set(g,[]);m.get(g).push(c)});
  let i=0,out='';
  REG_ORDER.filter(r=>regs.has(r)).forEach(r=>{
    const m=regs.get(r);const all=[...m.values()].flat();
    if(region==='Todas')out+=`<li class="reg"><b>${esc(r)}</b><span>${all.filter(c=>doneC[c.d]).length}/${all.length}</span></li>`;
    [...m.keys()].sort((a,b)=>a.localeCompare(b,'pt',{numeric:true})).forEach(g=>{
      const grp=m.get(g),c0=grp[0];
      const label=c0.uf==="INT"?esc(c0.p):`DDD ${esc(g)}`;
      const sub=c0.uf==="INT"?'':` <span>${esc(UF[c0.uf]||c0.uf)}</span>`;
      const allDone=grp.every(c=>doneC[c.d]);
      out+=`<li class="ddd"><div><b>${label}</b>${sub} <span>· ${grp.filter(c=>doneC[c.d]).length}/${grp.length}</span></div>
        <button class="gmark" type="button" data-g="${esc(g)}" data-on="${allDone?0:1}">${allDone?'Desmarcar todos':'Marcar todos'}</button></li>`;
      out+=grp.map(c=>rowC(c,++i)).join('');
    });
  });
  $('list').innerHTML=out;
}

function render(){header();subTabs();view==='clin'?renderClin():renderCont()}

document.querySelectorAll('.mtab').forEach(b=>b.onclick=()=>{
  view=b.dataset.v;try{localStorage.setItem(KEY_VIEW,view)}catch(e){}
  $('q').value='';render();window.scrollTo({top:0});
});
$('sub').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  if(b.dataset.c)city=b.dataset.c;
  if(b.dataset.r)region=b.dataset.r;
  render();
});
let qt;$('q').oninput=()=>{clearTimeout(qt);qt=setTimeout(render,120)};
$('hideDone').onchange=render;
$('list').addEventListener('click',e=>{
  const c=e.target.closest('.copy');
  if(c){const t=c.dataset.copy;navigator.clipboard.writeText(t).then(()=>{c.textContent='Copiado';setTimeout(()=>c.textContent='Copiar',1200)}).catch(()=>{c.textContent=t});return}
  const g=e.target.closest('.gmark');
  if(g){const on=g.dataset.on==='1';contFiltered().filter(x=>grpOf(x)===g.dataset.g).forEach(x=>{if(on)doneC[x.d]=1;else delete doneC[x.d]});save();render();return}
  const w=e.target.closest('.wa');
  if(w&&view==='cont'){const k=w.closest('li').querySelector('.chk');if(k&&!doneC[k.dataset.d]){doneC[k.dataset.d]=1;save();setTimeout(render,300)}}
});
$('list').addEventListener('change',e=>{
  const k=e.target.closest('input.chk');if(!k)return;
  if(k.dataset.t){if(k.checked)done[k.dataset.t]=1;else delete done[k.dataset.t]}
  if(k.dataset.d){if(k.checked)doneC[k.dataset.d]=1;else delete doneC[k.dataset.d]}
  save();render();
});
render();
</script>
